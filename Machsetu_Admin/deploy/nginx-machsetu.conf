# MachSetu admin console + API.
#
#   sudo cp deploy/nginx-machsetu.conf /etc/nginx/sites-available/machsetu
#   sudo ln -s /etc/nginx/sites-available/machsetu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot AFTER this file is in place; it rewrites the server block to
# add the TLS listeners and the port-80 redirect.

upstream machsetu_admin {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name machsetu.com www.machsetu.com;

    # Photos and documents are streamed out of MongoDB, so the body limit has
    # to clear the app's own 8 MB per-file cap with room for the envelope.
    client_max_body_size 12M;

    # A slow phone on 3G should not have its upload cut off.
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Next serves its own compression for HTML; this covers the rest.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        proxy_pass http://machsetu_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://machsetu_admin;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_buffering off;
    }

    # Nothing here is a secret, but there is no reason to advertise the stack.
    server_tokens off;
}
